# Local stand-in for ingress-nginx --enable-ssl-passthrough:
# route raw TLS by SNI hostname without terminating it (NVFLARE does its own mutual TLS).
events {}
stream {
  map $ssl_preread_server_name $fedlify_aggregator {
    hf-mortality.fedlify.test aggregator:8002;
    default                   127.0.0.1:1;
  }
  log_format sni '$remote_addr sni=$ssl_preread_server_name -> $fedlify_aggregator status=$status';
  access_log /dev/stdout sni;
  resolver 127.0.0.11 valid=10s;
  server {
    listen 443;
    ssl_preread on;
    proxy_pass $fedlify_aggregator;
  }
}
