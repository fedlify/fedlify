apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedlify-web
  labels:
    app.kubernetes.io/name: fedlify-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fedlify-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fedlify-web
    spec:
      serviceAccountName: fedlify-web
      imagePullSecrets:
        - name: harbor-registry
      # Configuration comes from Kubernetes Secrets (IaC/day2/fedlify-runtime and day2/github-fedlify):
      #   fedlify-web-runtime                DATABASE_URL, NEXTAUTH_*, S3_*
      #   fedlify-agent-orchestrator-secrets FEDLIFY_ORCHESTRATOR_TOKEN, FEDLIFY_CONTROL_SIGNING_SECRET, OPENAI_API_KEY
      #   gitea-credentials, argo-webhook-secret, fedlify-adapter-signing, harbor-studies-pull (single keys below)
      initContainers:
        - name: migrate
          image: harbor.fedlify.com/fedlify/web:latest
          command: ["/bin/sh", "-c", "pnpm --filter @fedlify/web exec prisma migrate deploy"]
          envFrom:
            - secretRef: { name: fedlify-web-runtime }
      containers:
        - name: web
          image: harbor.fedlify.com/fedlify/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef: { name: fedlify-web-runtime }
            - secretRef: { name: fedlify-agent-orchestrator-secrets }
          env:
            - name: NODE_ENV
              value: production
            - name: FEDLIFY_PUBLIC_BASE_URL
              value: https://app.fedlify.com
            - name: FEDLIFY_ORCHESTRATOR_URL
              value: http://fedlify-agent-orchestrator.fedlify.svc.cluster.local:3020
            - name: FEDLIFY_ARGO_NAMESPACE
              value: fedlify
            # Workflow callbacks stay inside the cluster (the public edge blocks the callback step's user agent).
            - name: FEDLIFY_CALLBACK_BASE_URL
              value: http://fedlify-web.fedlify.svc.cluster.local
            # Persisted assistant history, plan mode and changes timeline. Unset or false restores the stateless panel.
            - name: AGENT_THREADS_ENABLED
              value: "true"
            # Control plane over assistant turns: off | shadow | enforce. shadow evaluates and records every turn and never
            # blocks; enforce behaves like shadow until the enforcement phase ships.
            - name: ASSISTANT_CONTROL_MODE
              value: "shadow"
            - name: FEDLIFY_PIPELINE_WORKFLOW_TEMPLATE
              value: fedlify-study-pipeline-ci
            - name: GITEA_BASE_URL
              valueFrom: { secretKeyRef: { name: gitea-credentials, key: baseUrl } }
            - name: GITEA_TOKEN
              valueFrom: { secretKeyRef: { name: gitea-credentials, key: token } }
            - name: GITEA_ORG
              value: fedlify-templates
            - name: GITEA_PUBLIC_TEMPLATE_ORG
              value: fedlify-templates
            - name: GITEA_STUDY_ORG_PREFIX
              value: fedlify-study
            - name: ARGO_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: argo-webhook-secret, key: secret } }
            # Publish -> per-study aggregator at <slug>.<domain>:443 (deploy/k8s/publish-workflow-template.yaml)
            - name: FEDLIFY_PUBLISH_WORKFLOW_TEMPLATE
              value: fedlify-study-publish
            - name: FEDLIFY_STUDY_DOMAIN
              value: fedlify.com
            - name: FEDLIFY_ADAPTER_SIGNING_SECRET
              valueFrom: { secretKeyRef: { name: fedlify-adapter-signing, key: secret } }
            - name: FEDLIFY_STUDY_REGISTRY
              valueFrom: { secretKeyRef: { name: harbor-studies-pull, key: registry } }
            - name: FEDLIFY_STUDY_PULL_USERNAME
              valueFrom: { secretKeyRef: { name: harbor-studies-pull, key: username } }
            - name: FEDLIFY_STUDY_PULL_PASSWORD
              valueFrom: { secretKeyRef: { name: harbor-studies-pull, key: password } }
            # Registry model (docs/site-runner-and-ux-design.md section 15). `legacy` publishes to fedlify-studies as before;
            # `per-study` gives each study its own Harbor project and each site kit its own pull robot. Flip only after the
            # live checks in 15.9 passed and the base image carries fedlify_runtime.harbor. Kit creation for a study already
            # in its own project mints robots whatever this flag says (it follows the image path).
            - name: FEDLIFY_REGISTRY_MODE
              value: legacy
            - name: FEDLIFY_STUDY_PROJECT_QUOTA_GIB
              value: "20"
            - name: FEDLIFY_STUDY_RETENTION_KEEP
              value: "10"
            - name: FEDLIFY_SITE_ROBOT_DAYS
              value: "90"
            # The limited provisioner robot (Terraform: harbor-provisioner). optional: the web app starts without it and
            # legacy mode never reads it. Mounted here and in the publish workflow only.
            - name: FEDLIFY_HARBOR_URL
              valueFrom: { secretKeyRef: { name: harbor-provisioner, key: url, optional: true } }
            - name: FEDLIFY_HARBOR_PROVISIONER_USERNAME
              valueFrom: { secretKeyRef: { name: harbor-provisioner, key: username, optional: true } }
            - name: FEDLIFY_HARBOR_PROVISIONER_PASSWORD
              valueFrom: { secretKeyRef: { name: harbor-provisioner, key: password, optional: true } }
          command: ["pnpm", "--filter", "@fedlify/web", "start"]
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fedlify-web
