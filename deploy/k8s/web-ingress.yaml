apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fedlify-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    external-dns.alpha.kubernetes.io/expose: "true"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/target: "206.12.103.4"
    external-dns.alpha.kubernetes.io/hostname: app.fedlify.com
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.fedlify.com
      secretName: fedlify-web-tls
  rules:
    - host: app.fedlify.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fedlify-web
                port:
                  name: http
