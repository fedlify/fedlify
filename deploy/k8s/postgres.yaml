# Fedlify platform database. Credentials: Secret fedlify-postgres (IaC/day2/fedlify-runtime).
apiVersion: v1
kind: Service
metadata:
  name: fedlify-postgres
  labels:
    app.kubernetes.io/name: fedlify-postgres
spec:
  selector:
    app.kubernetes.io/name: fedlify-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fedlify-postgres
  labels:
    app.kubernetes.io/name: fedlify-postgres
spec:
  serviceName: fedlify-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fedlify-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fedlify-postgres
    spec:
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: fedlify-postgres, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: fedlify-postgres, key: password } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: fedlify-postgres, key: database } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
