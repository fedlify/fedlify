# S3-compatible object storage for Fedlify artifacts (join kits, client startup kits, results).
# Public at s3.fedlify.com so hospitals can download presigned join kits; credentials in Secret fedlify-minio.
apiVersion: v1
kind: Service
metadata:
  name: fedlify-minio
  labels:
    app.kubernetes.io/name: fedlify-minio
spec:
  selector:
    app.kubernetes.io/name: fedlify-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fedlify-minio
  labels:
    app.kubernetes.io/name: fedlify-minio
spec:
  serviceName: fedlify-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fedlify-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fedlify-minio
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: minio
          # MinIO stopped publishing public images in 2025; Chainguard's free build, pinned by digest.
          image: cgr.dev/chainguard/minio@sha256:d88920d6a50bd0b088223b688be3b76c63e6205dbe494437f67ba1240ea12880
          args: ["server", "/data"]
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: fedlify-minio, key: rootUser } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: fedlify-minio, key: rootPassword } }
            - name: MINIO_BROWSER
              value: "off"
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fedlify-minio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    external-dns.alpha.kubernetes.io/expose: "true"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/target: "206.12.103.4"
    external-dns.alpha.kubernetes.io/hostname: s3.fedlify.com
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - s3.fedlify.com
      secretName: fedlify-minio-tls
  rules:
    - host: s3.fedlify.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fedlify-minio
                port:
                  name: s3
