apiVersion: v1
kind: ConfigMap
metadata:
  name: fedlify-agent-orchestrator
  namespace: fedlify
data:
  PORT: "3020"
  FEDLIFY_HOSTED_MODEL: "gpt-5.5"
  FEDLIFY_HOSTED_REASONING_EFFORT: "medium"
  FEDLIFY_LOCAL_MODEL_NAME: "gpt-oss:20b"
  FEDLIFY_CODEX_MODEL: "gpt-5.3-codex"
  FEDLIFY_AGENT_TIMEOUT_MS: "120000"
  FEDLIFY_COORDINATOR_MAX_OUTPUT_TOKENS: "2000"
